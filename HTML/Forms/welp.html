<!DOCTYPE html>
<html>
    <head>
        <title>Welp</title>
    </head>
    <body>
        <form>
            <label for="name">Name: </label>
            <input type="text" id="name" name="name" required>
            <br>
            <br>
            <label for="item_name">Item Name: </label>
            <input type="text" id="item_name" name="item_name" required>
            <br>
            <br>
            <input type="radio" id="option1" name="options" value="yes" >
            <label for="option1">Yes</label>
            <input type="radio" id="option2" name="options" value="no" >
            <label for="option2">No</label>
            <input type="radio" id="option3" name="options" value="maybe" >
            <label for="option3">Maybe</label>
            <br>
            <br>
            <label for="rating">Rating: </label>
            <input type="number" name="rating" id="rating" min="1" max="5" >
            <br>
            <br>
            <label for="text_area">Review: </label>
            <br>
            <textarea name="Review" id="text_area" placeholder="Write your Comments..."></textarea>
            <br>
            <br>
            <input type="submit" value="Submit Review">
        </form>
    </body>
</html>
