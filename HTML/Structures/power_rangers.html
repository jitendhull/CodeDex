<!DOCTYPE html>
<html>
    <!-- This is the Head of the HTML Site -->
    <head>
        <!-- Title of the Site -->
        <title>Power Rangers</title>
        <!-- Defined Style Element with class definitions (.____) and id (#___) -->
        <style>
            .ranger-div {
                width: 50%;
                height: 100px;
            }
            #red-ranger {
                background-color:red
            }
            #blue-ranger {
                background-color:blue
            }
            #black-ranger {
                background-color:black;
            }
            #yellow-ranger {
                background-color: yellow;
            }
            #pink-ranger {
                background-color: pink;
            }
        </style>
    </head>
    <body>
        <!-- Divisions of the Site with unique id and same class -->
        <div class="ranger-div" id="red-ranger"></div>
        <div class="ranger-div" id="blue-ranger"></div>
        <div class="ranger-div" id="black-ranger"></div>
        <div class="ranger-div" id="yellow-ranger"></div>
        <div class="ranger-div" id="pink-ranger"></div>
    </body>
</html>
